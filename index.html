<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BudgetZen</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf8ff;--sf:#fff;--tx:#241f3d;--mu:#6a6588;--bd:#e7e2f8;--pr:#6a46f0;--pr2:#8d72f6;--soft:#f0ebff;--on:#fff;--ok:#12a373;--er:#c93555}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#13101f;--sf:#1c1830;--tx:#efedfb;--mu:#aaa6cc;--bd:#2f2a4d;--pr:#9b84ff;--pr2:#b3a1ff;--soft:#241f43;--on:#1a1530;--ok:#4cd0a0;--er:#ff7b98}}
:root[data-theme=dark]{--bg:#13101f;--sf:#1c1830;--tx:#efedfb;--mu:#aaa6cc;--bd:#2f2a4d;--pr:#9b84ff;--pr2:#b3a1ff;--soft:#241f43;--on:#1a1530;--ok:#4cd0a0;--er:#ff7b98}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.fig,.logo{font-family:ui-rounded,"SF Pro Rounded","Avenir Next",Nunito,system-ui,sans-serif;line-height:1.15}h1,h2,h3{margin:0 0 .5em}
a{color:var(--pr)}.w{max-width:1040px;margin:0 auto;padding:0 18px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--sf);padding:8px;z-index:99}
header{border-bottom:1px solid var(--bd);background:var(--sf)}.hd{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.logo{font-weight:800;font-size:22px;text-decoration:none;color:var(--tx)}.logo b{color:var(--pr)}
nav{display:flex;gap:2px;flex-wrap:wrap}nav a{padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--mu)}nav a[aria-current]{background:var(--soft);color:var(--pr);font-weight:600}
main.w{padding-top:28px;padding-bottom:56px;outline:0}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:18px}
.g{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.p{background:var(--pr);border-color:var(--pr);color:var(--on)}.btn[disabled]{opacity:.55;cursor:not-allowed}.btn.i{min-width:44px;padding:0}.btn.d{color:var(--er)}
:focus-visible{outline:3px solid var(--pr2);outline-offset:2px}
input,select,textarea{font:inherit;min-height:44px;width:100%;padding:0 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx)}
textarea{font:12px/1.4 ui-monospace,monospace;padding:10px;margin:8px 0}label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row input,.row select{flex:1 1 130px;width:auto}.sp{justify-content:space-between}
.mu{color:var(--mu)}.bar{height:10px;background:var(--soft);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--pr2));transition:width .4s}
.fig{font-size:clamp(30px,7vw,46px);font-weight:800}.pos{color:var(--ok)}.neg{color:var(--er)}
.li{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}.li:last-child{border:0}.li>span:first-child{flex:1;min-width:0;overflow-wrap:anywhere}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.ov .card{width:100%;max-width:440px;max-height:90vh;overflow:auto}
#ts{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;display:none;z-index:60;max-width:92vw}
mark{background:#ffe08a;color:#3b2a00;padding:0 4px;border-radius:4px}.hero{padding:30px 0 22px;max-width:680px}.hero h1{font-size:clamp(34px,7vw,56px)}.hero p{font-size:18px;color:var(--mu)}
details{border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin-bottom:10px;background:var(--sf)}summary{cursor:pointer;font-weight:600}
footer{border-top:1px solid var(--bd);padding:22px 0;font-size:14px;color:var(--mu)}footer a{margin-right:14px;display:inline-block;padding:4px 0}
.tag{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--pr)}.ft{padding-left:18px}.ring{display:block;margin:0 auto}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
@media print{header,footer,form,button,#dg,#ts,.skip{display:none!important}body{background:#fff;color:#000}.card{break-inside:avoid;border-color:#bbb}}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}.sr{position:absolute;left:-9999px}td,th{padding:6px 8px;border-bottom:1px solid var(--bd)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<a class="skip" href="#v">Aller au contenu</a>
<header><div class="w hd"><a href="#/" class="logo">Budget<b>Zen</b></a><nav id="nv" aria-label="Navigation principale"></nav></div></header>
<main id="v" class="w" tabindex="-1"></main>
<footer><div class="w"><div id="fl"></div><p>BudgetZen — outil d’information, pas un conseil financier.</p></div></footer>
<div id="dg"></div><div id="ts" role="status" aria-live="polite"></div>
<script>
// À COMPLÉTER par l'éditeur avant toute publication commerciale (laisser vide = « À COMPLÉTER » affiché).
const CFG={editeur:'',adresse:'',siret:'',directeur:'',hebergeur:'',email:'',premium:{prix:'4,99 €',periode:'mois'}};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Math.random().toString(36).slice(2,10);
const CAT={logement:['Logement','#6a46f0'],alim:['Alimentation','#f59e0b'],transport:['Transport','#0ea5c6'],loisirs:['Loisirs','#e0559b'],sante:['Santé','#12a373'],abos:['Abonnements','#8d72f6'],autres:['Autres','#94a3b8']};
const blank=()=>({name:'',m:{},goals:[],cur:'EUR',cats:[],rec:[],bud:{}});let S=blank(),hq='',hf='all',ym=new Date().toISOString().slice(0,7),ed=null,D=null,store=true;
try{localStorage.setItem('bz_t','1');localStorage.removeItem('bz_t');const d=JSON.parse(localStorage.getItem('bz1')||'null');if(d&&d.m)S={...S,...d}}catch(e){store=false}
const save=()=>{try{localStorage.setItem('bz1',JSON.stringify(S))}catch(e){store=false;toast('Sauvegarde impossible sur cet appareil : tes données ne seront pas conservées.')}};
// Montants en centimes (entiers) : calculs exacts. Accepte 12, 12.5, 12,50 ; refuse négatifs et >2 décimales.
const cents=v=>{const m=String(v??'').trim().replace(/\s/g,'').replace(',','.').match(/^(\d{1,9})(?:\.(\d{1,2}))?$/);return m?Number(m[1])*100+Number((m[2]||'0').padEnd(2,'0')):NaN};
const eur=c=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:S.cur||'EUR'}).format(c/100);
const CURS=['EUR','USD','GBP','CHF','CAD'],PAL=['#d946ef','#f97316','#14b8a6','#3b82f6','#84cc16','#ef4444'];
const CT=()=>({...CAT,...Object.fromEntries(S.cats.map(c=>['c_'+c.id,[c.n,c.col]]))}),cg=k=>CT()[k]||CAT.autres;
// Les opérations récurrentes s'appliquent à tous les mois à partir de leur mois de départ.
const mo=k=>{const s=S.m[k]||{inc:[],exp:[]},r=S.rec.filter(x=>x.from<=k).map(x=>({id:'r'+x.id,l:x.l,c:x.c,k:x.k,t:x.t,r:1}));return{inc:[...s.inc,...r.filter(x=>x.t==='inc')],exp:[...s.exp,...r.filter(x=>x.t==='exp')]}},sum=a=>a.reduce((t,x)=>t+x.c,0),wr=()=>S.m[ym]||(S.m[ym]={inc:[],exp:[]});
const shift=(k,n)=>{const[y,m]=k.split('-').map(Number);return new Date(Date.UTC(y,m-1+n,1)).toISOString().slice(0,7)};
const ml=(k,o)=>new Date(k+'-01T12:00:00Z').toLocaleDateString('fr-FR',{...o,timeZone:'UTC'});
const pct=p=>p===null?'—':(p*100).toFixed(1).replace('.',',')+' %';
function toast(m){const t=$('#ts');t.textContent=m;t.style.display='block';clearTimeout(t._);t._=setTimeout(()=>t.style.display='none',3800)}
function dlg(t,b,ok,fn){D=fn;$('#dg').innerHTML=`<div class="ov"><div class="card" role="dialog" aria-modal="true" aria-label="${esc(t)}"><h3>${esc(t)}</h3>${b}<div class="row" style="margin-top:12px"><button class="btn p" data-a="ok">${ok}</button><button class="btn" data-a="no">Annuler</button></div></div></div>`;const i=$('#dg input,#dg textarea');if(i)i.focus()}
const del=(m,fn)=>dlg('Confirmation',`<p>${m}</p>`,'Supprimer',()=>{fn();save();go();toast('Supprimé ✓')});
const fin=m=>{save();go();toast(m)};
const fill=k=>CFG[k]?esc(CFG[k]):'<mark>À COMPLÉTER</mark>';
const lb=()=>`<div class="card" style="margin-bottom:14px"><b>Brouillon non validé juridiquement.</b> <span class="mu">Texte indicatif à faire relire avant toute publication commerciale ; rien ici n’atteste une conformité légale.</span></div>`;

function csv(){const r=[['Mois','Type','Libellé','Catégorie','Montant (€)']];Object.keys(S.m).sort().forEach(k=>{S.m[k].inc.forEach(x=>r.push([k,'Revenu',x.l,'',x.c]));S.m[k].exp.forEach(x=>r.push([k,'Dépense',x.l,cg(x.k)[0],x.c]))});
S.rec.forEach(x=>r.push([x.from,'Récurrent '+(x.t==='inc'?'revenu':'dépense'),x.l,x.t==='exp'?cg(x.k)[0]:'',x.c]));
return r.map((l,i)=>l.map(c=>{const n=typeof c==='number';c=n?(c/100).toFixed(2).replace('.',','):String(c);if(!n&&/^[=+\-@]/.test(c))c="'"+c;return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')).join('\n')}
function csvDlg(){if(!Object.keys(S.m).length&&!S.rec.length)return toast('Aucune donnée à exporter pour le moment.');
dlg('Exporter mes données (CSV)',`<p class="mu">Copie ce texte dans un tableur, ou télécharge-le (selon ton navigateur).</p><textarea id="ct" readonly rows="8" aria-label="Données CSV">${esc(csv())}</textarea><button class="btn" data-a="dl">Télécharger</button>`,'Copier',()=>{const t=$('#ct');t.select();try{document.execCommand('copy');toast('Copié ✓')}catch(e){toast('Sélectionne le texte et copie-le.')}return false})}
function dl(){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv()],{type:'text/csv'}));a.download='budgetzen.csv';a.click()}catch(e){toast('Téléchargement indisponible : utilise « Copier ».')}}

function donut(exp,E){const by=Object.keys(CT()).map(k=>({k,c:sum(exp.filter(x=>x.k===k))})).filter(x=>x.c>0);if(!by.length)return '<p class="mu">Ajoute une dépense pour voir la répartition.</p>';
let o=0;const seg=by.map(x=>{const p=100*x.c/E,s=`<circle cx="21" cy="21" r="15.9155" fill="none" style="stroke:${cg(x.k)[1]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${-o}" transform="rotate(-90 21 21)"/>`;o+=p;return s}).join('');
return `<div class="row"><svg viewBox="0 0 42 42" width="150" height="150" role="img" aria-label="Répartition des dépenses par catégorie">${seg}</svg><ul style="list-style:none;padding:0;margin:0;flex:1 1 150px">${by.map(x=>`<li><span class="sw" style="background:${cg(x.k)[1]}"></span>${esc(cg(x.k)[0])} : ${eur(x.c)} (${Math.round(100*x.c/E)} %)</li>`).join('')}</ul></div>`}
function bars(){const ks=[5,4,3,2,1,0].map(i=>shift(ym,-i)),d=ks.map(k=>({k,i:sum(mo(k).inc),e:sum(mo(k).exp)})),mx=Math.max(1,...d.flatMap(x=>[x.i,x.e]));
return `<svg viewBox="0 0 300 130" width="100%" role="img" aria-label="Revenus et dépenses des 6 derniers mois">${d.map((x,j)=>{const hi=Math.round(95*x.i/mx),he=Math.round(95*x.e/mx),X=j*50+7;return `<rect x="${X}" y="${100-hi}" width="17" height="${hi}" rx="3" fill="#12a373"><title>${ml(x.k)} — revenus ${eur(x.i)}</title></rect><rect x="${X+19}" y="${100-he}" width="17" height="${he}" rx="3" style="fill:var(--pr)"><title>${ml(x.k)} — dépenses ${eur(x.e)}</title></rect><text x="${X+18}" y="118" text-anchor="middle" font-size="10" style="fill:var(--mu)">${ml(x.k,{month:'short'})}</text>`}).join('')}</svg><p class="mu" style="font-size:13px"><span class="sw" style="background:#12a373"></span>Revenus <span class="sw" style="background:var(--pr);margin-left:10px"></span>Dépenses</p>`}


const sp=(exp,k)=>sum(exp.filter(x=>x.k===k)),opts=()=>Object.entries(CT()).map(([k,v])=>`<option value="${k}">${esc(v[0])}</option>`).join('');
const alertBox=exp=>{const a=Object.keys(S.bud).filter(k=>CT()[k]&&sp(exp,k)>S.bud[k]).map(k=>`${esc(cg(k)[0])} : dépassé de ${eur(sp(exp,k)-S.bud[k])}`);return a.length?`<div class="card" role="alert" style="border-color:var(--er);margin-bottom:14px"><b>Budget dépassé</b><ul class="ft" style="margin:6px 0 0">${a.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''};
const budCard=exp=>{const L=Object.keys(S.bud).filter(k=>CT()[k]&&S.bud[k]>0);return `<div class="card"><h2>Budgets par catégorie</h2><form data-f="bud" class="row"><select name="k" aria-label="Catégorie">${opts()}</select><input name="c" inputmode="decimal" placeholder="Plafond mensuel" aria-label="Plafond mensuel" required><button class="btn p">Définir</button></form>${L.map(k=>{const s=sp(exp,k),b=S.bud[k],q=Math.min(100,100*s/b);return `<div class="li" style="display:block"><div class="row sp"><b>${esc(cg(k)[0])}</b><span class="${s>b?'neg':''}">${eur(s)} / ${eur(b)}</span></div><div class="bar" style="margin:8px 0" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(q)}"><i style="width:${q}%;${s>b?'background:var(--er)':''}"></i></div><button class="btn i d" data-a="dbud" data-id="${k}" aria-label="Retirer le plafond ${esc(cg(k)[0])}">🗑</button></div>`}).join('')||'<p class="mu">Aucun plafond défini.</p>'}</div>`};
const recCard=()=>`<div class="card"><h2>Opérations récurrentes</h2><p class="mu" style="margin-top:0">Appliquées chaque mois à partir du mois affiché.</p><form data-f="rec" class="row"><select name="t" aria-label="Type"><option value="exp">Dépense</option><option value="inc">Revenu</option></select><input name="l" placeholder="Libellé (ex. Loyer)" aria-label="Libellé" maxlength="60"><input name="c" inputmode="decimal" placeholder="Montant" aria-label="Montant" required><select name="k" aria-label="Catégorie (dépenses)">${opts()}</select><button class="btn p">Ajouter</button></form>${S.rec.map(x=>`<div class="li"><span>${esc(x.l)} <span class="tag">${x.t==='inc'?'revenu':esc(cg(x.k)[0])}</span><br><small class="mu">depuis ${esc(ml(x.from,{month:'long',year:'numeric'}))}</small></span><b>${eur(x.c)}</b><button class="btn i d" data-a="drec" data-id="${x.id}" aria-label="Supprimer ${esc(x.l)}">🗑</button></div>`).join('')||'<p class="mu">Aucune opération récurrente.</p>'}</div>`;
const catCard=()=>`<div class="card"><h2>Mes catégories</h2><form data-f="cat" class="row"><input name="n" placeholder="Nouvelle catégorie" aria-label="Nom de la catégorie" maxlength="30" required><button class="btn p">Créer</button></form>${S.cats.map(c=>`<div class="li"><span><span class="sw" style="background:${esc(c.col)}"></span>${esc(c.n)}</span><button class="btn i d" data-a="dcat" data-id="${c.id}" aria-label="Supprimer ${esc(c.n)}">🗑</button></div>`).join('')||'<p class="mu">Catégories de base : '+Object.values(CAT).map(v=>v[0]).join(', ')+'.</p>'}</div>`;
const cmpCard=(I,E)=>{const p=mo(shift(ym,-1)),PI=sum(p.inc),PE=sum(p.exp),row=(l,a,b,bad)=>{const d=a-b;return `<tr><td>${l}</td><td>${eur(a)}</td><td>${eur(b)}</td><td class="${d===0?'':(d>0)===bad?'neg':'pos'}">${d>0?'+':d<0?'−':''}${eur(Math.abs(d))}</td></tr>`};return `<div class="card"><h2>Comparaison avec ${esc(ml(shift(ym,-1),{month:'long'}))}</h2><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:14px"><thead><tr><th scope="col" style="text-align:left"><span class="sr">Poste</span></th><th scope="col" style="text-align:left">Ce mois</th><th scope="col" style="text-align:left">Précédent</th><th scope="col" style="text-align:left">Écart</th></tr></thead><tbody>${row('Revenus',I,PI,false)}${row('Dépenses',E,PE,true)}${row('Reste',I-E,PI-PE,false)}</tbody></table></div></div>`};
function histList(){let o=[];Object.keys(S.m).forEach(k=>{S.m[k].inc.forEach(x=>o.push({k,t:'inc',l:x.l,c:x.c,n:''}));S.m[k].exp.forEach(x=>o.push({k,t:'exp',l:x.l,c:x.c,n:cg(x.k)[0]}))});const q=hq.trim().toLowerCase();o=o.filter(x=>(hf==='all'||x.t===hf)&&(!q||(x.l+' '+x.n).toLowerCase().includes(q))).sort((a,b)=>a.k<b.k?1:a.k>b.k?-1:0);
return o.slice(0,100).map(x=>`<div class="li"><span>${esc(x.l)} ${x.n?`<span class="tag">${esc(x.n)}</span>`:''}<br><small class="mu">${esc(ml(x.k,{month:'long',year:'numeric'}))}</small></span><b class="${x.t==='inc'?'pos':''}">${x.t==='inc'?'+':'−'}${eur(x.c)}</b></div>`).join('')||'<p class="mu">Aucune opération ne correspond.</p>'}
const histCard=()=>`<div class="card" style="margin-top:14px"><h2>Historique des opérations</h2><div class="row"><input id="hq" type="search" placeholder="Rechercher…" aria-label="Rechercher une opération" value="${esc(hq)}"><select id="hf" aria-label="Type d’opération"><option value="all">Tout</option><option value="inc"${hf==='inc'?' selected':''}>Revenus</option><option value="exp"${hf==='exp'?' selected':''}>Dépenses</option></select></div><div id="hl">${histList()}</div></div>`;
const V={};
V.home=()=>`<div class="hero"><h1>Voyez où va votre argent, sans stress.</h1><p>BudgetZen calcule vos dépenses, votre solde et vos objectifs d’épargne. Vos données restent sur votre appareil.</p><div class="row"><a class="btn p" href="#/budget">Ouvrir mon budget</a><a class="btn" href="#/tarifs">Voir les offres</a></div></div>
<div class="g g3"><div class="card"><h3>Calcul automatique</h3><p class="mu">Revenus, dépenses, argent restant et pourcentage du budget utilisé, mis à jour à chaque saisie.</p></div><div class="card"><h3>Dépenses par catégorie</h3><p class="mu">Logement, alimentation, transport… avec un graphique clair de la répartition.</p></div><div class="card"><h3>Objectifs d’épargne</h3><p class="mu">Fixez un montant, ajoutez des versements et suivez la progression.</p></div><div class="card"><h3>Mois par mois</h3><p class="mu">Naviguez entre les mois et comparez les six derniers.</p></div><div class="card"><h3>Export gratuit</h3><p class="mu">Récupérez vos données au format CSV pour un tableur.</p></div><div class="card"><h3>Sans compte</h3><p class="mu">Rien n’est envoyé à un serveur : tout est enregistré dans votre navigateur.</p></div></div>`;
V.budget=()=>{const{inc,exp}=mo(ym),I=sum(inc),E=sum(exp),R=I-E,p=I>0?E/I:null,e=ed&&exp.find(x=>x.id===ed.id),over=p!==null&&p>1,C=326.73,d=p===null?0:Math.min(1,p)*C;
return `<div class="row sp"><h1 style="margin:0">Mon budget</h1><div class="row"><button class="btn i" data-a="prev" aria-label="Mois précédent">‹</button><input type="month" value="${ym}" aria-label="Mois" data-a="" id="mi" style="width:auto;flex:0 0 auto"><button class="btn i" data-a="next" aria-label="Mois suivant">›</button></div></div>
<p class="mu">${esc(ml(ym,{month:'long',year:'numeric'}))}${store?'':' — ⚠ sauvegarde locale indisponible : les données seront perdues à la fermeture.'}</p>
${alertBox(exp)}<div class="g g2" style="margin:14px 0"><div class="card"><svg class="ring" viewBox="0 0 120 120" width="170" height="170" role="img" aria-label="${pct(p)} du budget utilisé"><circle cx="60" cy="60" r="52" fill="none" style="stroke:var(--soft)" stroke-width="12"/><circle cx="60" cy="60" r="52" fill="none" style="stroke:${over?'var(--er)':'var(--pr)'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${d} ${C}" transform="rotate(-90 60 60)"/></svg><div style="text-align:center"><div class="fig ${R<0?'neg':'pos'}">${eur(R)}</div><div class="mu">Reste ce mois-ci</div></div></div>
<div class="card"><div class="row sp"><span>Revenus</span><b class="pos">${eur(I)}</b></div><div class="row sp"><span>Dépenses</span><b>${eur(E)}</b></div><p style="margin:14px 0 6px">Budget utilisé : <b>${pct(p)}</b></p><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(Math.min(100,(p||0)*100))}"><i style="width:${Math.min(100,(p||0)*100)}%"></i></div><p class="${over?'neg':'mu'}" style="margin-bottom:0">${p===null?(E>0?'Ajoutez un revenu pour calculer le pourcentage.':'Ajoutez vos revenus et vos dépenses pour commencer.'):over?'Vos dépenses dépassent vos revenus de '+eur(E-I)+'.':'Il vous reste '+eur(R)+' à répartir.'}</p></div></div>
<div class="g g2"><div class="card"><h2>Revenus</h2><form data-f="inc" class="row"><input name="l" placeholder="Libellé (ex. Salaire)" aria-label="Libellé du revenu" maxlength="60"><input name="c" inputmode="decimal" placeholder="Montant" aria-label="Montant du revenu" required><button class="btn p">Ajouter</button></form>${inc.map(x=>`<div class="li"><span>${esc(x.l)}</span><b>${eur(x.c)}</b>${x.r?'<span class="tag">récurrent</span>':`<button class="btn i d" data-a="dinc" data-id="${x.id}" aria-label="Supprimer ${esc(x.l)}">🗑</button>`}</div>`).join('')||'<p class="mu">Aucun revenu ce mois-ci.</p>'}</div>
<div class="card"><h2>${e?'Modifier la dépense':'Dépenses'}</h2><form data-f="exp" class="row"><input name="l" placeholder="Libellé (ex. Courses)" aria-label="Libellé de la dépense" maxlength="60" value="${e?esc(e.l):''}"><input name="c" inputmode="decimal" placeholder="Montant" aria-label="Montant de la dépense" required value="${e?(e.c/100).toFixed(2).replace('.',','):''}"><select name="k" aria-label="Catégorie">${Object.entries(CT()).map(([k,v])=>`<option value="${k}" ${e&&e.k===k?'selected':''}>${esc(v[0])}</option>`).join('')}</select><button class="btn p">${e?'Enregistrer':'Ajouter'}</button>${e?'<button type="button" class="btn" data-a="cx">Annuler</button>':''}</form>${exp.map(x=>`<div class="li"><span>${esc(x.l)} <span class="tag">${esc(cg(x.k)[0])}</span></span><b>${eur(x.c)}</b>${x.r?'<span class="tag">récurrent</span>':`<button class="btn i" data-a="eexp" data-id="${x.id}" aria-label="Modifier ${esc(x.l)}">✏️</button><button class="btn i d" data-a="dexp" data-id="${x.id}" aria-label="Supprimer ${esc(x.l)}">🗑</button>`}</div>`).join('')||'<p class="mu">Aucune dépense ce mois-ci.</p>'}</div>
<div class="card"><h2>Répartition</h2>${donut(exp,E)}</div><div class="card"><h2>Six derniers mois</h2>${bars()}</div>
${budCard(exp)}${recCard()}${catCard()}${cmpCard(I,E)}<div class="card" style="grid-column:1/-1"><h2>Objectifs d’épargne</h2><form data-f="goal" class="row"><input name="n" placeholder="Objectif (ex. Vacances)" aria-label="Nom de l’objectif" maxlength="60" required><input name="t" inputmode="decimal" placeholder="Montant visé" aria-label="Montant visé" required><button class="btn p">Créer</button></form>${S.goals.map(g=>{const q=Math.min(100,100*g.s/g.t);return `<div class="li" style="display:block"><div class="row sp"><b>${esc(g.n)}</b><span>${eur(g.s)} / ${eur(g.t)} · ${Math.round(q)} %</span></div><div class="bar" style="margin:8px 0" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(q)}"><i style="width:${q}%"></i></div><button class="btn" data-a="pay" data-id="${g.id}">Ajouter un versement</button> <button class="btn i d" data-a="dgoal" data-id="${g.id}" aria-label="Supprimer ${esc(g.n)}">🗑</button></div>`}).join('')||'<p class="mu">Aucun objectif. Créez-en un pour suivre votre épargne.</p>'}</div></div>
${histCard()}<p class="row"><button class="btn" data-a="csv">Exporter (CSV)</button><button class="btn" data-a="print">Imprimer / enregistrer en PDF</button></p>`};
V.tarifs=()=>`<h1>Offres</h1><div class="g g2"><div class="card"><h2>Gratuite</h2><p class="fig">0 €</p><ul class="ft"><li>Calculateur de budget complet</li><li>Calcul automatique des dépenses et du solde</li><li>Pourcentage du budget utilisé</li><li>Objectifs d’épargne et progression</li><li>Graphiques et navigation par mois</li><li>Catégories personnalisées, budgets par catégorie et alertes</li><li>Opérations récurrentes</li><li>Comparaison avec le mois précédent</li><li>Historique avec recherche</li><li>Export CSV et PDF (via l’impression du navigateur)</li></ul><a class="btn p" href="#/budget">Commencer gratuitement</a></div>
<div class="card"><h2>Premium</h2><p class="fig">${CFG.premium.prix} <span class="mu" style="font-size:16px">/ ${CFG.premium.periode} (prix envisagé)</span></p><ul class="ft"><li>Toutes les fonctions gratuites</li><li>Sauvegarde dans un compte <span class="tag">à venir</span></li><li>Synchronisation entre appareils <span class="tag">à venir</span></li></ul><button class="btn" disabled>Bientôt disponible</button><p class="mu" style="font-size:14px">Aucun paiement n’est possible aujourd’hui : le service de paiement n’est pas configuré.</p></div></div>`;
const soon=(t)=>`<h1>${t}</h1><div class="card"><p>Les comptes utilisateurs ne sont <b>pas encore disponibles</b> : ils demandent un service d’authentification qui n’est pas configuré. Aucune connexion n’est simulée.</p><p class="mu">En attendant, le calculateur fonctionne sans compte et enregistre vos données sur cet appareil.</p><a class="btn p" href="#/budget">Ouvrir mon budget</a></div>`;
V.connexion=()=>soon('Connexion');V.inscription=()=>soon('Créer un compte');
V.profil=()=>`<h1>Profil et paramètres</h1><div class="g g2"><div class="card"><h2>Mon prénom</h2><form data-f="name" class="row"><input name="n" value="${esc(S.name)}" maxlength="40" aria-label="Prénom ou pseudo"><button class="btn p">Enregistrer</button></form><p class="mu">Stocké uniquement sur cet appareil. Devise : euro (€).</p></div><div class="card"><h2>Devise</h2><select id="cs" aria-label="Devise">${CURS.map(c=>`<option${S.cur===c?' selected':''}>${c}</option>`).join('')}</select><p class="mu">Affichage des montants uniquement ; aucune conversion.</p></div><div class="card"><h2>Mes données</h2><p class="mu">Elles sont dans le stockage local de ce navigateur. Exportez-les pour en garder une copie.</p><div class="row"><button class="btn" data-a="csv">Exporter (CSV)</button><button class="btn d" data-a="wipe">Effacer toutes mes données</button></div></div></div>`;
V.abonnement=()=>`<h1>Mon abonnement</h1><div class="card"><p>Offre actuelle : <b>Gratuite</b></p><p class="mu">Premium (${CFG.premium.prix} / ${CFG.premium.periode} envisagé) n’est pas encore ouvert : aucun paiement n’est possible et aucune donnée bancaire n’est demandée ni conservée par ce site.</p><a class="btn" href="#/tarifs">Voir les offres</a></div>`;
V.contact=()=>`<h1>Contact</h1><div class="g g2"><div class="card"><h2>Écrire à BudgetZen</h2><form data-f="contact" novalidate><label for="cn">Nom</label><input id="cn" name="n" autocomplete="name" maxlength="80" required><label for="ce">Adresse e-mail</label><input id="ce" name="e" type="email" autocomplete="email" maxlength="120" required><label for="cj">Objet</label><input id="cj" name="s" maxlength="120" required><label for="cm">Message</label><textarea id="cm" name="m" rows="5" maxlength="2000" required style="font:inherit;min-height:120px"></textarea><div class="hp" aria-hidden="true"><label>Ne pas remplir<input name="website" tabindex="-1" autocomplete="off"></label></div><p><button class="btn p">Préparer l’e-mail</button></p></form><p class="mu" style="font-size:14px">Ce formulaire ouvre votre application e-mail avec le message prêt à envoyer ; il n’envoie rien automatiquement.</p></div><div class="card"><h2>Adresse de contact</h2>${CFG.email?`<p><a class="btn p" href="mailto:${esc(CFG.email)}">Envoyer un e-mail</a></p><p class="mu">${esc(CFG.email)}</p>`:'<p><mark>À COMPLÉTER</mark> — aucune adresse réelle n’est encore configurée.</p>'}</div></div>`;
V.faq=()=>`<h1>Questions fréquentes</h1>${[['BudgetZen est-il gratuit ?','Oui : le calculateur et ses fonctions actuelles sont gratuits. Une offre Premium est envisagée à '+CFG.premium.prix+' par '+CFG.premium.periode+' mais n’est pas ouverte.'],['Où sont enregistrées mes données ?','Dans le stockage local de votre navigateur, sur cet appareil. Elles ne sont pas envoyées à un serveur et ne se synchronisent pas entre appareils.'],['Que se passe-t-il si j’efface les données du navigateur ?','Vos saisies sont perdues. Exportez-les régulièrement en CSV depuis « Mon budget » ou « Profil ».'],['Puis-je créer un compte ?','Pas encore. Les comptes nécessitent un service qui n’est pas configuré.'],['Les calculs sont-ils exacts ?','Les montants sont traités en centimes entiers, sans arrondi flottant. Utilisez un nombre positif avec au plus deux décimales.'],['BudgetZen donne-t-il des conseils financiers ?','Non, c’est un outil d’information et de suivi.']].map(([q,a])=>`<details><summary>${q}</summary><p class="mu">${a}</p></details>`).join('')}`;
V.mentions=()=>`<h1>Mentions légales</h1>${lb()}<div class="card"><p>Éditeur : ${fill('editeur')}</p><p>Adresse : ${fill('adresse')}</p><p>Numéro d’immatriculation (SIREN/SIRET) : ${fill('siret')}</p><p>Directeur de la publication : ${fill('directeur')}</p><p>Contact : ${fill('email')}</p><p>Hébergeur : ${fill('hebergeur')}</p></div>`;
V.confidentialite=()=>`<h1>Politique de confidentialité</h1>${lb()}<div class="card"><p>Ce site n’utilise ni cookie publicitaire ni outil de mesure d’audience, et n’envoie vos saisies à aucun serveur.</p><p>Vos revenus, dépenses et objectifs sont enregistrés dans le stockage local de votre navigateur. Vous pouvez les exporter ou les effacer définitivement dans « Profil ». Ce site ne dépose aucun cookie : seul le stockage local est utilisé.</p><p class="mu">À compléter : responsable du traitement (${fill('editeur')}), contact (${fill('email')}), journaux de l’hébergeur (${fill('hebergeur')}) et vos droits applicables.</p></div>`;
V.cgu=()=>`<h1>Conditions générales d’utilisation</h1>${lb()}<div class="card"><p>BudgetZen est un outil de calcul et de suivi à titre informatif ; il ne constitue pas un conseil financier.</p><p>Les données étant stockées sur votre appareil, vous êtes responsable de leur sauvegarde (export CSV). Le service est fourni sans garantie de disponibilité.</p><p class="mu">À compléter : droit applicable, juridiction, modification des conditions (${fill('editeur')}).</p></div>`;
V.cgv=()=>`<h1>Conditions de vente</h1>${lb()}<div class="card"><p>Aucun service payant n’est proposé actuellement.</p><p class="mu">Prévu : paiement par un prestataire reconnu (Stripe envisagé) ; ce site ne recevra ni ne stockera aucun numéro de carte. Résiliation, remboursements et factures : à rédiger.</p><p class="mu">Avant d’ouvrir Premium, il faudra rédiger : prix TTC, moyens de paiement, durée et renouvellement, résiliation, droit de rétractation, facturation, médiateur de la consommation. Éditeur : ${fill('editeur')}.</p></div>`;
V[404]=()=>`<h1>Page introuvable</h1><p><a class="btn p" href="#/">Retour à l’accueil</a></p>`;
const T={home:'Accueil',budget:'Mon budget',tarifs:'Offres',connexion:'Connexion',inscription:'Créer un compte',profil:'Profil',abonnement:'Mon abonnement',contact:'Contact',faq:'FAQ',mentions:'Mentions légales',confidentialite:'Confidentialité',cgu:'CGU',cgv:'Conditions de vente'};
const NAV=[['home','Accueil'],['budget','Mon budget'],['tarifs','Offres'],['faq','FAQ'],['contact','Contact'],['profil','Profil']];
const FL=[['connexion','Connexion'],['inscription','Créer un compte'],['abonnement','Mon abonnement'],['mentions','Mentions légales'],['confidentialite','Confidentialité'],['cgu','CGU'],['cgv','Conditions de vente']];
function go(){const k=(location.hash.replace(/^#\/?/,'')||'home').split('?')[0];$('#v').innerHTML=(V[k]||V[404])();document.title=(T[k]||'Page introuvable')+' — BudgetZen';
$('#nv').innerHTML=NAV.map(([h,t])=>`<a href="#/${h}"${k===h?' aria-current="page"':''}>${t}</a>`).join('');$('#fl').innerHTML=FL.map(([h,t])=>`<a href="#/${h}">${t}</a>`).join('')+'<p>Contact : '+(CFG.email?`<a href="mailto:${esc(CFG.email)}">${esc(CFG.email)}</a>`:'<mark>À COMPLÉTER</mark>')+'</p>'}
addEventListener('hashchange',()=>{ed=null;go();scrollTo(0,0);$('#v').focus()});
document.addEventListener('change',e=>{if(e.target.id==='mi'&&/^\d{4}-\d{2}$/.test(e.target.value)){ym=e.target.value;ed=null;go()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#dg').innerHTML=''});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;const A={
prev:()=>{ym=shift(ym,-1);ed=null;go()},next:()=>{ym=shift(ym,1);ed=null;go()},eexp:()=>{ed={id};go()},cx:()=>{ed=null;go()},
dexp:()=>del('Supprimer cette dépense ?',()=>{wr().exp=wr().exp.filter(x=>x.id!==id)}),dinc:()=>del('Supprimer ce revenu ?',()=>{wr().inc=wr().inc.filter(x=>x.id!==id)}),
dgoal:()=>del('Supprimer cet objectif ?',()=>{S.goals=S.goals.filter(x=>x.id!==id)}),
pay:()=>{const g=S.goals.find(x=>x.id===id);dlg('Ajouter un versement',`<label for="pv">Montant versé pour « ${esc(g.n)} »</label><input id="pv" inputmode="decimal">`,'Ajouter',()=>{const c=cents($('#pv').value);if(!(c>0)){toast('Montant invalide (ex. 50 ou 12,50).');return false}g.s+=c;save();go();toast('Versement ajouté ✓')})},
csv:csvDlg,dl,print:()=>window.print(),dbud:()=>del('Retirer ce plafond ?',()=>{delete S.bud[id]}),drec:()=>del('Supprimer cette opération récurrente ?',()=>{S.rec=S.rec.filter(x=>x.id!==id)}),dcat:()=>del('Supprimer cette catégorie ? Ses dépenses passent en « Autres ».',()=>{Object.values(S.m).forEach(m=>m.exp.forEach(x=>{if(x.k==='c_'+id)x.k='autres'}));S.rec.forEach(x=>{if(x.k==='c_'+id)x.k='autres'});S.cats=S.cats.filter(x=>x.id!==id);delete S.bud['c_'+id]}),wipe:()=>del('Effacer toutes les données de cet appareil ? Action irréversible.',()=>{S=blank();ed=null}),
ok:()=>{if(D&&D()===false)return;$('#dg').innerHTML=''},no:()=>{$('#dg').innerHTML=''}};(A[a]||(()=>{}))()});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-f]');if(!f)return;e.preventDefault();const v=Object.fromEntries(new FormData(f)),c=cents(v.c),bad=()=>toast('Montant invalide : nombre positif, deux décimales maximum (ex. 12,50).');const A={
inc:()=>{if(!(c>0))return bad();wr().inc.push({id:uid(),l:(v.l||'Revenu').trim().slice(0,60),c});fin('Revenu ajouté ✓')},
exp:()=>{if(!(c>0))return bad();const o={l:(v.l||'Dépense').trim().slice(0,60),c,k:CT()[v.k]?v.k:'autres'},t=ed&&wr().exp.find(x=>x.id===ed.id);if(t)Object.assign(t,o);else wr().exp.push({id:uid(),...o});ed=null;fin('Dépense enregistrée ✓')},
goal:()=>{const t=cents(v.t);if(!(t>0)||!v.n.trim())return toast('Indiquez un nom et un montant visé valide.');S.goals.push({id:uid(),n:v.n.trim().slice(0,60),t,s:0});fin('Objectif créé ✓')},
bud:()=>{if(!(c>0))return bad();if(!CT()[v.k])return;S.bud[v.k]=c;fin('Plafond enregistré ✓')},
rec:()=>{if(!(c>0))return bad();S.rec.push({id:uid(),t:v.t==='inc'?'inc':'exp',l:(v.l||'Récurrent').trim().slice(0,60),c,k:C
T()[v.k]?v.k:'autres',from:ym});fin('Opération récurrente ajoutée ✓')},
  
cat:()=>{const n=(v.n||'').trim().slice(0,30);if(!n)return toast('Indiquez un nom de catégorie.');if(Object.values(CT()).some(x=>x[0].toLowerCase()===n.toLowerCase()))return toast('Cette catégorie existe déjà.');S.cats.push({id:uid(),n,col:PAL[S.cats.length%PAL.length]});fin('Catégorie créée ✓')},
contact:()=>{if(v.website)return;const n=(v.n||'').trim(),em=(v.e||'').trim(),sj=(v.s||'').trim(),m=(v.m||'').trim();
if(n.length<2||n.length>80)return toast('Indiquez votre nom (2 à 80 caractères).');if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)||em.length>120)return toast('Adresse e-mail invalide.');
if(sj.length<3||sj.length>120)return toast('Objet : 3 à 120 caractères.');if(m.length<10||m.length>2000)return toast('Message : 10 à 2000 caractères.');
try{if(Date.now()-(+sessionStorage.getItem('bz_c')||0)<60000)return toast('Patientez une minute avant un nouvel envoi.')}catch(x){}
if(!CFG.email)return toast('Adresse de contact non configurée : message non envoyé.');try{sessionStorage.setItem('bz_c',Date.now())}catch(x){}
location.href='mailto:'+CFG.email+'?subject='+encodeURIComponent(sj)+'&body='+encodeURIComponent('Nom : '+n+'\nE-mail : '+em+'\n\n'+m);toast('Votre application e-mail s’ouvre : appuyez sur Envoyer pour finaliser.')},
name:()=>{S.name=(v.n||'').trim().slice(0,40);fin('Profil enregistré ✓')}};(A[f.dataset.f]||(()=>{}))()});
document.addEventListener('change',e=>{if(e.target.id==='cs'&&CURS.includes(e.target.value)){S.cur=e.target.value;save();go()}});
document.addEventListener('input',e=>{if(e.target.id==='hq'||e.target.id==='hf'){hq=$('#hq').value;hf=$('#hf').value;$('#hl').innerHTML=histList()}});
go();
</script></body></html>
